name: SKIVE unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install -q -U pip
          python -m pip install -q numpy pytest
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile the SKIVE package and the patched vLLM files
        run: |
          python -m py_compile vllm/kv_evict/*.py skive/*.py \
            vllm/config/cache.py vllm/engine/arg_utils.py vllm/v1/worker/gpu_model_runner.py \
            vllm/v1/attention/backends/flash_attn.py vllm/v1/attention/backends/triton_attn.py \
            vllm/v1/engine/core.py vllm/v1/worker/gpu/model_runner.py
      - name: Run the SKIVE unit tests (CPU; the GPU test skips itself)
        run: python -m pytest skive/tests -q -p no:cacheprovider
